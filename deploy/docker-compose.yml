# Full local stack: limiterd -> Redis (counters) and -> OTel Collector (metrics) -> Prometheus.
#   docker compose -f deploy/docker-compose.yml up --build
#   curl -s localhost:8080/v1/limits:check -d '{"api_key":"k1","path":"/v1/x","method":"GET","ip":"1.2.3.4"}'
#   open http://localhost:9090  (query: rate(ratelimiter_decisions_total[1m]))
services:
  redis:
    image: redis:7-alpine
    command: ["redis-server", "--save", "", "--appendonly", "no"]
  otel-collector:
    image: otel/opentelemetry-collector-contrib:latest
    command: ["--config=/etc/otel.yaml"]
    volumes: ["./otel-collector.yaml:/etc/otel.yaml:ro"]
    ports: ["4318:4318", "8889:8889"]
  prometheus:
    image: prom/prometheus:latest
    volumes: ["./prometheus.yml:/etc/prometheus/prometheus.yml:ro"]
    ports: ["9090:9090"]
  limiterd:
    build: ..
    command:
      - -config=/configs/rules.distributed.json
      - -redis=redis:6379
      - -otlp-endpoint=http://otel-collector:4318/v1/metrics
      - -otlp-interval=5s
    ports: ["8080:8080"]
    depends_on: [redis, otel-collector]
