global: { scrape_interval: 5s }
scrape_configs:
  - job_name: otel-collector   # metrics pushed via OTLP, re-exposed by the collector
    static_configs: [{ targets: ["otel-collector:8889"] }]
  - job_name: limiterd         # direct pull of the built-in /metrics (alternative path)
    static_configs: [{ targets: ["limiterd:8080"] }]
